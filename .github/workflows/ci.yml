name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP and pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libtap-parser-sourcehandler-pgtap-perl
          docker exec ${{ job.services.postgres.id }} sh -c "apt-get update && apt-get install -y postgresql-16-pgtap"
      - run: ./scripts/db-test.sh
      - name: Seed applies cleanly, twice
        run: |
          ./scripts/db-test.sh --seed
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d memory_nest_test -v ON_ERROR_STOP=1 -f supabase/seed/seed.sql

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    env:
      # Optional repository secrets. Without them the app runs in demo mode and the sign-in
      # journey (tests/e2e/auth.spec.ts) is skipped; with them it runs against the real project.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Lighthouse accessibility (must be at least 95)
        run: |
          pnpm start -p 3100 &
          npx --yes wait-on http://127.0.0.1:3100/api/health
          node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  worker:
    name: Worker tests and image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-ebgaramond ffmpeg
      - run: pip install -r worker/requirements-dev.txt
      - run: cd worker && python -m pytest -q
      - run: docker build -t memory-nest-worker worker
